name: ERS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Write .env from secret
        env:
          PROD: ${{ secrets.PROD }}
        run: printf '%s\n' "$PROD" > .env

      - name: Restart app with PM2
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          pm2 delete ers || true
          pm2 start server.js --name ers
          pm2 save

      - name: Health check
        run: |
          sleep 5
          curl --fail http://localhost:3000/health