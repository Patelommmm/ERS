<!DOCTYPE html>

<link rel="stylesheet" href="css/style.css">
</head>
<body class="app">

    <div id="filters"></div>
    <div id="productList" class="product-list">

    </div>
</main>

<footer class="footer" id="footer"></footer>

<script src="js/auth.js"></script>
<script src="js/components.js"></script>
