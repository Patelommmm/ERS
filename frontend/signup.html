<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
<header class="topbar" id="topbar"></header>

<main class="content auth-page">
    <form id="signup" class="card">
        <h1>Sign Up</h1>
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required minlength="6">
        <select name="role" required>
            <option value="" disabled selected>Select role</option>
            <option value="Holder">Holder (I list equipment)</option>
            <option value="Renter">Renter (I rent equipment)</option>
        </select>
        <button type="submit">Sign Up</button>
        <p>Already have an account? <a href="login.html" data-keep-next>Login</a></p>
    </form>
</main>

<footer class="footer" id="footer"></footer>

<script src="js/auth.js"></script>
<script src="js/components.js"></script>
</body>
</html>
